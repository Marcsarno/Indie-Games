<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Dungeon Prototype (Simple)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
  #hint {
    position: fixed; left: 8px; top: 8px; color: #b09574; font: 12px/1.4 monospace;
    background: rgba(0,0,0,.6); padding: 4px 8px; pointer-events: none; transition: opacity 1s;
  }
</style>
</head>
<body>
<canvas id="c" width="270" height="480"></canvas>
<div id="hint">WASD / arrows / left stick: move &middot; Space / J / right stick: attack &middot; C: swap team color</div>
<script>
'use strict';
// Everything on screen is generated by this script: no image assets.
// The scene renders at 270x480 into a palette-indexed buffer, gets a banded torch-lighting
// pass, is snapped to a fixed palette, and is scaled up with nearest-neighbor.

const W = 270, H = 480;
const cvs = document.getElementById('c');
const ctx = cvs.getContext('2d');
const outImg = ctx.createImageData(W, H);
const out32 = new Uint32Array(outImg.data.buffer);

// ---------------------------------------------------------------- palette
const PAL_HEX = [
  '000000',                                                             // 0  transparent
  '0a0706', '140f0c', '1f1712',                                         // 1-3   blacks
  '2a211a', '382c23', '47392d', '574738', '6a5744', '7f6a53', '977f63', 'b09574', 'cbb08a', // 4-12 stone
  '4a1f0e', '8a3a12', 'c4601a', 'ec9a32', 'f8d16a', 'fff4c4',           // 13-18 fire
  '2e0a0a', '4f1010', '7a1a17', 'a82822', 'd4473a',                     // 19-23 blood / red
  '8c7f64', 'b9ac8c', 'dcd2b4', 'f4eedc',                               // 24-27 bone
  '2c3036', '4a5058', '737b84', 'a4acb3', 'd6dce0',                     // 28-32 steel
  '33200f', '52341b', '774c28', '9c6a3a',                               // 33-36 wood
  '0d1640', '1d3592', '3b62d6', '8fb0ff',                               // 37-40 blue (UI only)
  '2b1a17', '44291f', '603a2a',                                         // 41-43 spider
  '6e4220', '94602f', 'b57f47', 'd4a263',                               // 44-47 torch-lit warm browns
  '6b4a0e', 'a8781a', 'deae2a', 'f8de6a',                               // 48-51 gold trim
];
const NPAL = PAL_HEX.length;
const PR = new Uint8Array(NPAL), PG = new Uint8Array(NPAL), PB = new Uint8Array(NPAL);
const PAL32 = new Uint32Array(NPAL);
PAL_HEX.forEach((h, i) => {
  PR[i] = parseInt(h.slice(0, 2), 16); PG[i] = parseInt(h.slice(2, 4), 16); PB[i] = parseInt(h.slice(4, 6), 16);
  PAL32[i] = (255 << 24) | (PB[i] << 16) | (PG[i] << 8) | PR[i];
});
const lum = i => (0.299 * PR[i] + 0.587 * PG[i] + 0.114 * PB[i]) / 255;
const S = [4, 5, 6, 7, 8, 9, 10, 11, 12];   // stone ramp
const FIRE = [13, 14, 15, 16, 17, 18];
const RED = [19, 20, 21, 22, 23];
const BONE = [24, 25, 26, 27];
const STEEL = [28, 29, 30, 31, 32];
const WOOD = [33, 34, 35, 36];
const BLK = 1, K1 = 2, K2 = 3, EMIS = 128;

// Lit colors get snapped back to the palette through 15-bit lookup tables. The environment
// snaps to earthy colors only; the knight may also use gold and blue so trim and team
// colors survive the torchlight without leaking into the stone.
function buildLUT(cand) {
  const LUT = new Uint8Array(32768);
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
    const R = r * 8 + 4, G = g * 8 + 4, B = b * 8 + 4;
    let best = 1, bd = 1e12;
    for (const i of cand) {
      const dr = R - PR[i], dg = G - PG[i], db = B - PB[i], rm = (R + PR[i]) / 2;
      const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
      if (d < bd) { bd = d; best = i; }
    }
    LUT[(r << 10) | (g << 5) | b] = best;
  }
  return LUT;
}
const ENV_COLORS = [];
for (let i = 1; i <= 36; i++) if (i < 15 || i > 18) ENV_COLORS.push(i);
ENV_COLORS.push(41, 42, 43, 44, 45, 46, 47);
const LUT_ENV = buildLUT(ENV_COLORS);
const LUT_CHAR = buildLUT([...ENV_COLORS, 37, 38, 39, 40, 48, 49, 50, 51]);

const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16);

function hash(a, b, c = 0) {
  let h = Math.imul(a | 0, 374761393) ^ Math.imul(b | 0, 668265263) ^ Math.imul(c | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------------------------------------------------------------- map
// Tile (i,j) projects to world pixels with a 2:1 isometric grid of 32x16 tiles.
const MW = 23, MH = 20;
const VOID = 0, FLOOR = 1, WALL = 2, LOW = 3;
const map = new Uint8Array(MW * MH);
for (let j = 0; j < MH; j++) for (let i = 0; i < MW; i++) {
  let t = VOID;
  if ((i === 0 && j <= 17) || (j === 0 && i <= 21)) t = WALL;
  else if (i >= 1 && i <= 20 && j >= 1 && j <= 17) t = FLOOR;
  else if ((j === 18 && i <= 21) || (i === 21 && j <= 17)) t = LOW;
  map[j * MW + i] = t;
}
const tileAt = (i, j) => (i < 0 || j < 0 || i >= MW || j >= MH) ? VOID : map[j * MW + i];
const solid = new Set();
const key = (i, j) => i + ',' + j;
function blocked(fi, fj) {
  const i = Math.floor(fi), j = Math.floor(fj);
  return tileAt(i, j) !== FLOOR || solid.has(key(i, j));
}

const WX0 = 336, WY0 = 112, WW = 744, WH = 480;
const WALLH = 96;
const iso = (fi, fj) => [WX0 + (fi - fj) * 16, WY0 + (fi + fj) * 8];

// ---------------------------------------------------------------- floor layer (world space)
const floorBuf = new Uint8Array(WW * WH);
function genFloor() {
  for (let y = 0; y < WH; y++) for (let x = 0; x < WW; x++) {
    const A = (x - WX0) + 2 * (y - WY0), B = 2 * (y - WY0) - (x - WX0);
    const t = tileAt(Math.floor(A / 32), Math.floor(B / 32));
    let v = BLK;
    if (t === FLOOR || t === WALL) {
      const sb = Math.floor(B / 16), A2 = A + (sb & 1) * 8;
      const ma = ((A2 % 16) + 16) % 16, mb = ((B % 16) + 16) % 16;
      if (ma < 2 || mb < 2) v = K2;
      else {
        const sa = Math.floor(A2 / 16);
        const h = hash(sa, sb, 7);
        let tone = 2 + Math.floor(h * 3);
        if (ma < 4 || mb < 4) tone += 1; else if (ma >= 14 || mb >= 14) tone -= 1;
        const ph = hash(x, y, 3);
        if (ph < 0.07) tone -= 1; else if (ph > 0.975) tone += 1;
        if (h > 0.92) tone -= 1;
        v = S[clamp(tone, 0, 8)];
      }
    }
    floorBuf[y * WW + x] = v;
  }
}
function stampBlood(wx, wy, size, seed) {
  const r = rng(seed);
  const blobs = 3 + size * 2;
  for (let n = 0; n < blobs; n++) {
    const cx = wx + (r() - 0.5) * size * 7, cy = wy + (r() - 0.5) * size * 3;
    const rx = 1.5 + r() * size * 1.6, ry = rx * 0.5;
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
      const dx = (x - cx) / rx, dy = (y - cy) / ry, d = dx * dx + dy * dy;
      if (d > 1 || x < 0 || y < 0 || x >= WW || y >= WH) continue;
      const k = y * WW + x;
      if (floorBuf[k] === BLK) continue;
      if (d > 0.75 && hash(x, y, seed) < 0.4) continue;
      floorBuf[k] = d < 0.45 ? RED[2] : RED[1];
      if (hash(x, y, seed + 1) < 0.05) floorBuf[k] = RED[3];
    }
  }
  for (let n = 0; n < size * 7; n++) {
    const a = r() * 6.283, d = size * 3 + r() * size * 6;
    const x = Math.round(wx + Math.cos(a) * d), y = Math.round(wy + Math.sin(a) * d * 0.5);
    if (x >= 0 && y >= 0 && x < WW && y < WH && floorBuf[y * WW + x] !== BLK) floorBuf[y * WW + x] = RED[1];
  }
}

// ---------------------------------------------------------------- sprite builder
// Sprites are drawn with primitives into a material buffer, then auto-shaded
// (lit from the upper left) and outlined.
const M = {}, MATS = [null];
function defMat(name, ramp, mid, opt = {}) { MATS.push({ ramp, mid, shiny: !!opt.shiny, flat: !!opt.flat, emis: !!opt.emis }); M[name] = MATS.length - 1; }
defMat('STEEL', STEEL, 1, { shiny: true });
defMat('BLADE', [29, 31, 32, 27], 2, { shiny: true });
defMat('IRON', [2, 28, 29, 30], 1);
defMat('BONE', BONE, 2);
defMat('CLOTH', [19, 20, 21, 22, 23], 2);
defMat('WOOD', WOOD, 2);
defMat('WOODTOP', [34, 35, 36], 1);
defMat('LEATHER', [33, 34, 35], 1);
defMat('FLESH', [19, 20, 21, 22, 23], 2);
defMat('HORN', [3, 24, 25], 1);
defMat('SPIDER', [2, 41, 42, 43], 2);
defMat('MARK', [20, 21, 22], 1);
defMat('GOLD', [48, 49, 50, 51], 2, { shiny: true });
defMat('ARMOR', STEEL, 2, { shiny: true });
defMat('TEAM_RED', [19, 20, 21, 22, 23], 3);
defMat('TEAM_BLUE', [37, 38, 39, 40], 2);
defMat('DARK', [2], 0, { flat: true });
defMat('EYE_RED', [23], 0, { flat: true, emis: true });
defMat('EYE_YEL', [17], 0, { flat: true, emis: true });
defMat('WAX', [25, 26, 27], 1);

// Shading mode: 'form' (default) shades each primitive from its analytic normal and one fixed
// light; 'edge' is the original edge-based shader, kept for A/B comparison (?shade=edge).
const SHADE = (typeof location !== 'undefined' && new URLSearchParams(location.search).get('shade')) || 'form';
const LIGHT = (() => { const v = [-0.55, -0.65, 0.52], l = Math.hypot(...v); return v.map(c => c / l); })();
const D0 = LIGHT[2];   // n·L of a face pointing straight at the viewer -> the material's mid tone

class SB {
  constructor(w, h, ax, ay) {
    this.w = w; this.h = h; this.ax = ax; this.ay = ay;
    const n = w * h;
    this.m = new Uint8Array(n); this.b = new Int8Array(n); this.r = new Uint8Array(n);
    this.nx = new Float32Array(n); this.ny = new Float32Array(n); this.nz = new Float32Array(n).fill(1);
    this.pid = new Uint16Array(n); this.cur = 0;
  }
  next() { if (!this.lock) this.cur++; }
  group(fn) { this.cur++; this.lock = true; fn(); this.lock = false; }
  idx(x, y) {
    x = Math.round(x) + this.ax; y = Math.round(y) + this.ay;
    return (x < 1 || y < 1 || x >= this.w - 1 || y >= this.h - 1) ? -1 : y * this.w + x;
  }
  // A primitive with a nonzero bias only nudges the tone of pixels already drawn in the same
  // material; it never starts a new part or replaces their normals.
  set(k, m, bias, nx = 0, ny = 0, nz = 1) {
    if (bias !== 0 && this.m[k] === m) { this.b[k] = bias; return; }
    this.m[k] = m; this.b[k] = bias; this.nx[k] = nx; this.ny[k] = ny; this.nz[k] = nz; this.pid[k] = this.cur;
  }
  px(x, y, m, bias = 0) { this.next(); const k = this.idx(x, y); if (k >= 0) this.set(k, m, bias); }
  raw(x, y, c) { const k = this.idx(x, y); if (k >= 0) { this.m[k] = 255; this.r[k] = c; } }
  // paint only where material `on` is already drawn (trim bands, visor slits); keeps the part and normal
  over(x0, y0, x1, y1, on, m, bias = 0) {
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const k = this.idx(x, y); if (k >= 0 && this.m[k] === on) { this.m[k] = m; this.b[k] = bias; } }
  }
  rect(x0, y0, x1, y1, m, bias = 0, n = null) {
    this.next();
    const cx = (x0 + x1) / 2, hw = (x1 - x0) / 2 + 0.5;
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const k = this.idx(x, y); if (k >= 0) this.set(k, m, bias, ...this.norm(n, x, cx, hw)); }
  }
  // n: null = flat (beveled at build time), [nx, ny] = tilted plane, 'cyl' = vertical cylinder
  norm(n, x, cx, hw) {
    if (!n) return [0, 0, 1];
    if (n === 'cyl') { const u = clamp((x - cx) / hw, -0.95, 0.95); return [u, 0, Math.sqrt(1 - u * u)]; }
    const [a, b] = n; return [a, b, Math.sqrt(Math.max(0.05, 1 - a * a - b * b))];
  }
  ell(cx, cy, rx, ry, m, bias = 0) {
    this.next();
    for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const u = (x - cx) / (rx + 0.5), v = (y - cy) / (ry + 0.5), d = u * u + v * v;
      if (d > 1) continue;
      const k = this.idx(x, y); if (k >= 0) this.set(k, m, bias, u, v, Math.sqrt(1 - d));
    }
  }
  line(x0, y0, x1, y1, m, wd = 1, bias = 0) {
    this.next();
    const n = Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) * 2) + 1, o = -Math.floor((wd - 1) / 2);
    const dx = x1 - x0, dy = y1 - y0, L2 = dx * dx + dy * dy || 1, r = wd / 2 + 0.4;
    for (let s = 0; s <= n; s++) {
      const x = Math.round(x0 + dx * s / n), y = Math.round(y0 + dy * s / n);
      for (let a = 0; a < wd; a++) for (let b = 0; b < wd; b++) {
        const px = x + o + b, py = y + o + a, k = this.idx(px, py);

        const ox = (px - (x0 + dx * t)) / r, oy = (py - (y0 + dy * t)) / r, q = Math.min(0.9, ox * ox + oy * oy);
        this.set(k, m, bias, ox, oy, Math.sqrt(1 - q));
      }
    }
  }
  poly(pts, m, bias = 0, n = null) {
    this.next();
    let y0 = Infinity, y1 = -Infinity, xa = Infinity, xb = -Infinity;
    for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); xa = Math.min(xa, p[0]); xb = Math.max(xb, p[0]); }
    const cx = (xa + xb) / 2, hw = (xb - xa) / 2 + 0.5;
    for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
      const xs = [];
      for (let i = 0; i < pts.length; i++) {
        const a = pts[i], b = pts[(i + 1) % pts.length];

      }
      xs.sort((p, q) => p - q);
      for (let i = 0; i + 1 < xs.length; i += 2) for (let x = Math.round(xs[i]); x <= Math.round(xs[i + 1]); x++) {
        const k = this.idx(x, y); if (k >= 0) this.set(k, m, bias, ...this.norm(n, x, cx, hw));
      }
    }
  }
  build() { return SHADE === 'edge' ? this.buildEdge() : this.buildForm(); }
  // original shader: tone from which sides of a pixel touch a different material
  buildEdge() {
    const { w, h, m, b, r } = this, d = new Uint8Array(w * h);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const k = y * w + x, mm = m[k];
      if (!mm) continue;
      if (mm === 255) { d[k] = r[k]; continue; }
      const mat = MATS[mm];
      if (mat.flat) { d[k] = mat.ramp[0] | (mat.emis ? EMIS : 0); continue; }
      const up = m[k - w] !== mm, dn = m[k + w] !== mm, lf = m[k - 1] !== mm, rt = m[k + 1] !== mm;
      let s = b[k] + (up ? 1 : 0) - (dn ? 1 : 0) + (lf ? 0.5 : 0) - (rt ? 0.5 : 0);
      if (mat.shiny && up && lf) s += 1;
      d[k] = mat.ramp[clamp(Math.round(mat.mid + s), 0, mat.ramp.length - 1)];

  // form shader: quantized Lambert from analytic normals, a cleanup pass against stray tone

  buildForm() {

    const tone = new Int8Array(n).fill(-1);
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const k = y * w + x, mm = m[k];
      if (!mm || mm === 255) continue;

      if (mat.flat) continue;

        const p = pid[k];

        const oy = (pid[k + w] !== p || !m[k + w] ? 1 : 0) - (pid[k - w] !== p || !m[k - w] ? 1 : 0);
        if (ox || oy) { ax = ox * 0.6; ay = oy * 0.6; az = 0.53; }
      }
      const dot = Math.max(0, ax * LIGHT[0] + ay * LIGHT[1] + az * LIGHT[2]);
      const len = mat.ramp.length;
      let t = mat.mid + (dot - D0) * (len - 0.5) + b[k];
      if (mat.shiny && dot > 0.93) t += 1;
      tone[k] = clamp(Math.round(t), lum(mat.ramp[0]) < 0.1 ? 1 : 0, len - 1);
    }

    const t2 = tone.slice();

      const k = y * w + x; if (tone[k] < 0) continue;
      const cnt = {}; let same = 0;
      for (const q of [k - 1, k + 1, k - w, k + w]) {
        if (tone[q] < 0 || pid[q] !== pid[k]) continue;
        if (tone[q] === tone[k]) same++; else cnt[tone[q]] = (cnt[tone[q]] || 0) + 1;
      }
      if (same === 0) for (const v in cnt) if (cnt[v] >= 3) t2[k] = +v;
    }
    const d = new Uint8Array(n);
    for (let k = 0; k < n; k++) {
      const mm = m[k]; if (!mm) continue;
      if (mm === 255) { d[k] = r[k]; continue; }
      const mat = MATS[mm];
      d[k] = mat.flat ? (mat.ramp[0] | (mat.emis ? EMIS : 0)) : mat.ramp[t2[k]];
    }
    // internal lines: a pixel of a rear part touching a front part gets its ramp's darkest step,
    // but only when the two colors are too close to separate on their own (Lospec)
    const o = d.slice();
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const k = y * w + x; if (t2[k] < 0) continue;
      for (const q of [k - 1, k + 1, k - w, k + w]) {
        if (!m[q] || m[q] === 255 || pid[q] <= pid[k] || (d[q] & EMIS)) continue;
        if (Math.abs(lum(d[q] & 127) - lum(d[k] & 127)) < 0.12) { const rp = MATS[m[k]].ramp; o[k] = rp[lum(rp[0]) < 0.1 ? 1 : 0]; break; }
      }
    }
    return this.outline(o);
  }
  outline(d) {
    const { w, h } = this, o = d.slice();
    for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
      const k = y * w + x;
      if (!d[k] && (d[k - 1] || d[k + 1] || d[k - w] || d[k + w])) o[k] = BLK;
    }
    return { w, h, ax: this.ax, ay: this.ay, data: o, z: null };
  }
}

// ---------------------------------------------------------------- iso boxes (walls, pillars, props)
// tex(face, a, b) -> palette index. face 'top': a,b = position on top in tile px;
// faces 'L' (facing +j) and 'R' (facing +i): a = distance along the face, b = height.
function makeBox(wi, wj, hgt, tex) {
  const w = Math.ceil(16 * (wi + wj)) + 2, h = Math.ceil(8 * (wi + wj) + hgt) + 2;
  const ox = Math.round(16 * wj), oy = hgt;
  const data = new Uint8Array(w * h), z = new Uint8Array(w * h);
  for (let py = 0; py < h; py++) for (let px = 0; px < w; px++) {
    const x = px + 0.5 - ox, y = py + 0.5 - oy;
    const yy = y + hgt;
    const fi = (x / 16 + yy / 8) / 2, fj = (yy / 8 - x / 16) / 2;
    let c = 0, zz = 0;
    if (fi >= 0 && fi < wi && fj >= 0 && fj < wj) { c = tex('top', fi * 16, fj * 16); zz = hgt; }
    else {
      const fi2 = x / 16 + wj, z1 = (fi2 + wj) * 8 - y;

    if (d > r - 0.5) { put(x, y, BLK); continue; }
    const nx = dx / r, ny = dy / r;
    const surf = cy + r - 2 * r * fill + Math.sin(x * 0.35 + t * 2.5) * 0.8;
    const bay = BAYER[((y & 3) << 2) | (x & 3)];
    if (y < surf) {
      const g = (-nx - ny) * 0.5 + bay * 0.5;
      put(x, y, g > 0.65 ? K2 : K1);
    } else {
      const lum = -0.45 * nx - 0.55 * ny + 0.75 * Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      let idx = Math.floor(lum * 3 + bay - 0.1);
      if (y < surf + 1) idx = 3;
      put(x, y, ramp[clamp(idx, 0, 3)]);
    }
    if ((nx + 0.36) ** 2 + (ny + 0.42) ** 2 < 0.03 || (nx + 0.1) ** 2 + (ny + 0.62) ** 2 < 0.006) put(x, y, 27);
  }
}
function drawStick(cx, cy, r, kx, ky, knob) {
  for (let y = cy - r - 1; y <= cy + r + 1; y++) for (let x = cx - r - 1; x <= cx + r + 1; x++) {
    const d = Math.hypot(x - cx, y - cy);
    if (Math.abs(d - r) < 0.6) put(x, y, (x + y) & 1 ? 31 : 30);
    else if (d < r && (x & 3) === 0 && (y & 3) === ((x >> 2) & 1) * 2) put(x, y, 29);
  }
  if (!knob) return;
  const ox = cx + kx * r * 0.6, oy = cy + ky * r * 0.6, kr = 8;
  for (let y = Math.floor(oy - kr - 1); y <= oy + kr + 1; y++) for (let x = Math.floor(ox - kr - 1); x <= ox + kr + 1; x++) {
    const dx = (x - ox) / kr, dy = (y - oy) / kr, d = Math.hypot(dx, dy);
    if (d > 1.12) continue;
    if (d > 1) { put(x, y, 28); continue; }
    const lum = -0.5 * dx - 0.6 * dy + 0.6 * Math.sqrt(1 - d * d);
    put(x, y, STEEL[clamp(Math.floor(lum * 2.5 + 1 + BAYER[((y & 3) << 2) | (x & 3)]), 0, 3)]);
  }
}
function drawUI(t) {
  drawStick(STICK.x, STICK.y, STICK.r, stick.dx, stick.dy, true);
  drawStick(ASTICK.x, ASTICK.y, ASTICK.r, 0, 0, false);
  drawOrb(36, 446, 24, [19, 20, 22, 23], 0.82, t, -1);
  drawOrb(234, 446, 24, [37, 38, 39, 40], mana, t + 1, 1);
}

// ---------------------------------------------------------------- loop
function resize() {
  scale = Math.min(innerWidth / W, innerHeight / H);
  if (scale >= 1) scale = Math.floor(scale);
  cvs.style.width = (W * scale) + 'px'; cvs.style.height = (H * scale) + 'px';
}
addEventListener('resize', resize); resize();
setTimeout(() => { document.getElementById('hint').style.opacity = 0; }, 5000);
let last = performance.now(), T = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; T += dt;
  update(dt, T); render(T);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
