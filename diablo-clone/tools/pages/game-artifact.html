<title>Dungeon of Bones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* one visual world: a dark crypt. The game draws every pixel itself on a 270-wide canvas,
     scaled with nearest-neighbor; the page only frames it. */
  :root { --crypt: #0a0706; --ember: #b09574; color-scheme: dark; }
  html, body { height: 100%; }
  body {
    background: var(--crypt); color: var(--ember); overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0; box-sizing: border-box;
  }
  #stage { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  noscript { display: block; padding: 24px 0; }
</style>
<div id="stage"><canvas id="c" width="270" height="480" aria-label="Dungeon of Bones game screen"></canvas></div>
<noscript>This game needs JavaScript.</noscript>
<!-- Every pixel is generated by these scripts: no image assets. -->
<script src="js/core.js"></script>
<script src="js/rig.js"></script>
<script src="js/actors.js"></script>
