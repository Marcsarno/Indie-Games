<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0706">
<title>Dungeons of Bones 3D</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a0706; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; touch-action: none; }
  #c { position: relative; z-index: 2; image-rendering: pixelated; image-rendering: crisp-edges; }
  #gl { position: absolute; z-index: 1; left: 50%; top: 50%; transform: translate(-50%, -50%); }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="c" width="270" height="480"></canvas></div>
<!-- The game itself is the 2D game's code, unchanged (copied from ../game/js at build time). -->
<script src="js/core.js"></script>
<script src="js/rig.js"></script>
<script src="js/actors.js"></script>
<script src="js/monsters.js"></script>
<script src="js/items.js"></script>
<script src="js/world.js"></script>
<script src="js/outdoor.js"></script>
<script src="js/sound.js"></script>
<script src="js/skills.js"></script>
<script src="js/game.js"></script>
<script src="js/quests.js"></script>
<script src="js/elites.js"></script>
<script src="js/preview.js"></script>
<script src="js/ui.js"></script>
<!-- The 3D layer: replaces only the drawing of the world. -->
<script src="js3d/bridge.js"></script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module" src="js3d/main.js"></script>
</body>
</html>
