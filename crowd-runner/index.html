<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Squad Rush</title>
<style>
  :root{--pill:rgba(14,22,38,.82);--ink:#fff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:#0b1220;overflow:hidden;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #frame{position:relative;height:100%;aspect-ratio:9/16;max-width:100%;max-height:100%;overflow:hidden;background:#7ec8ff}
  canvas{display:block;width:100%;height:100%}
  .pill{position:absolute;top:calc(env(safe-area-inset-top) + 2.2%);display:flex;align-items:center;gap:.5em;padding:.35em .9em .35em .55em;border-radius:.7em;background:var(--pill);color:var(--ink);font-weight:800;font-size:min(5.6vw,3.4vh);line-height:1}
  #squad{left:3%}#coins{right:3%}
  .pill svg{width:1.15em;height:1.15em}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{0%{transform:scale(1.25)}100%{transform:scale(1)}}
  #floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .fl{position:absolute;transform:translate(-50%,-50%);font-weight:900;font-size:min(8vw,4.6vh);color:#fff;text-shadow:0 .06em 0 rgba(0,0,0,.45),0 0 .4em rgba(0,0,0,.35);animation:rise 1.1s ease-out forwards;white-space:nowrap}
  .fl.good{color:#7dff6a}.fl.bad{color:#ff6a5e}.fl.info{color:#ffe36b}
  @keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
  #bossbar{position:absolute;left:18%;right:18%;top:10%;height:2.2%;background:rgba(0,0,0,.5);border-radius:99px;overflow:hidden;display:none;border:2px solid rgba(255,255,255,.8)}
  #bossbar i{display:block;height:100%;width:100%;background:linear-gradient(#c186ff,#7b3fc8)}
  #overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.2vh;background:rgba(8,14,28,.62);color:#fff;text-align:center;padding:8%}
  #overlay.show{display:flex}
  #overlay h1{margin:0;font-size:min(14vw,8vh);font-weight:900;letter-spacing:.02em;text-shadow:0 .06em 0 rgba(0,0,0,.4)}
  #overlay p{margin:0;font-size:min(5vw,3vh);opacity:.92;max-width:20em}
  button{font:inherit;font-weight:900;font-size:min(7vw,4vh);color:#fff;border:0;border-radius:.8em;padding:.6em 1.6em;background:linear-gradient(#41d96b,#1fa84a);box-shadow:0 .2em 0 #137a33;cursor:pointer}
  button:active{transform:translateY(.12em);box-shadow:0 .08em 0 #137a33}
  button.alt{background:linear-gradient(#4aa0ff,#2467d6);box-shadow:0 .2em 0 #184ca3}
  #hint{position:absolute;left:0;right:0;bottom:6%;text-align:center;color:#fff;font-weight:800;font-size:min(5vw,3vh);text-shadow:0 2px 6px rgba(0,0,0,.6);pointer-events:none;transition:opacity .4s}
  #fail{position:absolute;left:0;right:0;top:34%;text-align:center;font-weight:900;font-size:min(22vw,13vh);color:#ff3b30;text-shadow:0 .05em 0 #7a0f08;transform:rotate(-8deg);display:none;pointer-events:none;letter-spacing:.04em}
  #adtag{position:absolute;left:0;right:0;top:15.5%;text-align:center;color:#fff;font-weight:900;font-size:min(6.4vw,3.8vh);text-shadow:0 .06em 0 rgba(0,0,0,.5),0 0 .5em rgba(0,0,0,.4);display:none;pointer-events:none}
</style>
</head>
<body>
<div id="stage"><div id="frame">
  <canvas id="c"></canvas>
  <div id="squad" class="pill"><svg viewBox="0 0 24 24" fill="#4aa0ff"><circle cx="12" cy="6" r="4"/><path d="M4 22v-6a6 6 0 0 1 16 0v6z"/></svg><span id="squadN">3</span></div>
  <div id="coins" class="pill"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffc21a"/><circle cx="12" cy="12" r="6.5" fill="#ffe27a"/></svg><span id="coinN">0</span></div>
  <div id="bossbar"><i></i></div>
  <div id="floaters"></div>
  <div id="fail">FAIL</div>
  <div id="hint">Drag to move</div>
  <div id="adtag"></div>
  <div id="overlay"><h1 id="ovTitle"></h1><p id="ovText"></p><button id="ovBtn">Play</button><button id="ovBtn2" class="alt" style="display:none"></button></div>
</div></div>
<script type="importmap">{"imports":{"three":"./lib/three/three.module.min.js","three/addons/":"./lib/three/addons/"}}</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
