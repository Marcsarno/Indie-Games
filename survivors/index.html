<title>Bones Survivors</title>
<!-- Survivors mode: the Diablo-style game's own scripts, then survivors/js/surv.js on top. The base points every
     relative path (scripts, music, sounds) at the game folder. -->
<base href="../diablo-clone/game/">
<style>
  html, body { margin: 0; height: 100%; background: #0a0706; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="270" height="480"></canvas></div>
<!-- Every pixel is generated by these scripts: no image assets. -->
<script>
// Hold the game's frame loop until sv/surv.js has loaded: the browser may run a frame between two scripts, and
// the dungeon game's title screen would start (and fail) before the survivors mode takes over.
(function () { const raf = window.requestAnimationFrame.bind(window); let held = [];
  window.requestAnimationFrame = cb => { if (window.__svReady) return raf(cb); held.push(cb); return 0; };
  window.__svRelease = () => { window.__svReady = true; window.requestAnimationFrame = raf; const h = held; held = []; for (const cb of h) raf(cb); };
})();
</script>
