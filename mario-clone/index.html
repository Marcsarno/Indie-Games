<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Super Mario Bros. (fan recreation)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #pad { display: none; }
  body.touch #pad { display: block; position: fixed; left: 0; right: 0; bottom: 0; height: 36vh; padding-bottom: env(safe-area-inset-bottom); }
  body.touch:not(.portrait) #pad { height: 100%; top: 0; pointer-events: none; }
  body.touch:not(.portrait) #pad button { pointer-events: auto; }
  #pad button {
    position: absolute; width: 64px; height: 64px; border-radius: 50%; border: 2px solid #555; background: rgba(60,60,60,.7);
    color: #ddd; font: bold 20px monospace; touch-action: none; -webkit-tap-highlight-color: transparent;
  }
  #pad button.on { background: rgba(200,76,12,.85); }
  #pad .l { left: 6%; bottom: 36%; } #pad .r { left: 6%; bottom: 36%; margin-left: 138px; } #pad .d { left: 6%; bottom: 10%; margin-left: 69px; }
  #pad .a { right: 6%; bottom: 28%; width: 76px; height: 76px; } #pad .b { right: 6%; bottom: 10%; margin-right: 92px; width: 76px; height: 76px; }
  body.touch:not(.portrait) #pad .l { bottom: 32%; } body.touch:not(.portrait) #pad .r { bottom: 32%; }
</style>
</head>
<body>
<canvas id="c" width="256" height="240"></canvas>
<div id="pad">
  <button class="l" data-k="left">&#9664;</button>
  <button class="r" data-k="right">&#9654;</button>
  <button class="d" data-k="down">&#9660;</button>
  <button class="b" data-k="b">B</button>
  <button class="a" data-k="a">A</button>
</div>
<!-- Every pixel is generated by these scripts: no image assets. -->
<script src="js/art.js"></script>
<script src="js/sound.js"></script>
<script src="js/level.js"></script>
<script src="js/game.js"></script>
</body>
</html>
