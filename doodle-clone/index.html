<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120a2a">
<title>Spooky Hop</title>
<style>
  html,body{margin:0;height:100%;background:#120a2a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:"Trebuchet MS",system-ui,sans-serif;color:#fff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ui{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;pointer-events:none}
  .ui.on{display:flex}
  .ui>*{pointer-events:auto}
  #hud{position:fixed;left:0;right:0;top:0;display:none;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;font-weight:800;font-size:26px;text-shadow:0 2px 0 #2a1060,0 0 10px #0008;pointer-events:none}
  #hud.on{display:flex}
  #hud img{height:26px;vertical-align:-4px;margin-right:6px}
  h1{margin:calc(env(safe-area-inset-top) + 7vh) 0 0;font-size:48px;letter-spacing:1px;color:#ffd27a;text-shadow:0 3px 0 #5a2ab0,0 0 18px #ff9d2e88;text-align:center;line-height:1}
  h2{margin:0;font-size:22px;opacity:.9;text-shadow:0 2px 0 #2a1060}
  .big{font-size:56px;font-weight:900;color:#ffd27a;text-shadow:0 3px 0 #5a2ab0}
  button{font:inherit;color:#fff;border:0;border-radius:18px;padding:12px 22px;background:linear-gradient(#8a52e8,#5e2fb8);box-shadow:0 4px 0 #3a1c78,0 6px 14px #0006;font-weight:800;font-size:20px}
  button:active{transform:translateY(2px)}
  #play,#again{background:linear-gradient(#ffb02e,#f07a12);box-shadow:0 4px 0 #a04a08,0 6px 14px #0006;font-size:30px;padding:14px 44px;margin-top:18px}
  .row{display:flex;gap:10px;margin-top:14px}
  #closet,#closet2{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:340px;margin-top:16px;padding:10px;border-radius:18px;background:#1a0d3acc}
  .out{padding:6px 8px;width:58px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#3a2278;box-shadow:0 3px 0 #22104e}
  .out .em{font-size:26px;line-height:1}.out.sel{outline:3px solid #ffd27a}.out.lock{opacity:.55}
  .bar{position:relative;flex-basis:100%;height:20px;border-radius:10px;background:#0006;overflow:hidden;font-size:12px;display:flex;align-items:center;justify-content:center}
  .bar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#ffb02e,#f07a12)}.bar span{position:relative;font-weight:700}
  #newout{color:#ffd27a;font-weight:800;margin-top:8px;font-size:18px;text-align:center}
  .hint{margin-top:12px;font-size:14px;opacity:.8;text-align:center}
  #over{justify-content:center;background:#120a2acc}
  .cc{height:1.1em;vertical-align:-3px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="h">0 m</div><div><img src="assets/kit/pickup_candy_corn.webp" alt=""><span id="cd">0</span></div></div>
<div id="title" class="ui"><h1>Spooky<br>Hop</h1><button id="play">PLAY</button>
  <div class="row"><button id="tiltBtn">Tilt: OFF</button><button id="sndBtn">🔊</button></div>
  <div id="closet"></div><div class="hint">Hold the left or right side of the screen (or tilt) to steer. You jump by yourself!</div></div>
<div id="over" class="ui"><h2>You climbed</h2><div class="big" id="score">0 m</div><h2 id="best"></h2>
  <h2><img class="cc" src="assets/kit/pickup_candy_corn.webp" alt=""> <span id="gcandy">+0</span> candy</h2><div id="newout"></div><div id="closet2"></div>
  <button id="again">AGAIN</button><div class="row"><button id="menu">Menu</button></div></div>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
