<title>Chinatown Block</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed WebGL canvas; HUD pinned to the edges (title chip top-left, fps top-right, view/camera controls bottom). */
:root {
  --night: #0c1222;        /* page + panel base, deep blue-black */
  --panel: rgba(12, 18, 34, .78);
  --line: rgba(255, 236, 200, .16);
  --paper: #f3ead6;        /* warm text, like lit signage paper */
  --dim: #a9a79f;
  --lamp: #ffb347;         /* sodium-lamp amber, the one accent */
  --lantern: #e0361f;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--paper); font: 500 14px/1.35 var(--body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; left: 0; right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.top { top: 0; padding-top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bottom { bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: auto; }
.title { padding: 7px 11px 6px; }
.title b { display: block; font: 600 19px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.title span { color: var(--dim); font-size: 12px; }
#fps { padding: 5px 9px; font: 500 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.views { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; overflow: hidden; }
.views button { all: unset; box-sizing: border-box; text-align: center; padding: 11px 4px 10px; font: 600 15px/1 var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--dim); cursor: pointer; border-left: 1px solid var(--line); }
.views button:first-child { border-left: 0; }
.views button[aria-pressed="true"] { color: var(--night); background: var(--lamp); }
.views button:focus-visible { outline: 2px solid var(--paper); outline-offset: -3px; }
.cam { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 8px 12px 9px; }
.cam label { display: grid; gap: 3px; font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.cam label output { float: right; color: var(--paper); font-variant-numeric: tabular-nums; }
.cam input { width: 100%; margin: 0; accent-color: var(--lamp); touch-action: pan-x; }
#loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: var(--night); font: 600 22px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; z-index: 5; }
#loading small { font: 500 13px var(--body); letter-spacing: 0; text-transform: none; color: var(--dim); }
#loading .bar { width: 200px; height: 3px; background: var(--line); margin: 0 auto; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--lamp); }
#err { position: fixed; inset: 0; z-index: 6; display: grid; place-content: center; padding: 24px; text-align: center; background: var(--night); }
</style>
<canvas id="view"></canvas>
<div class="hud top"><div class="chip title"><b>Chinatown Block</b><span>Test scene &middot; built in Blender</span></div><div class="chip" id="fps">&ndash; fps</div></div>
<div class="hud bottom">
  <div class="chip cam">
    <label for="tilt">Tilt <output id="tiltv">65&deg;</output><input id="tilt" type="range" min="35" max="85" step="1" value="65"></label>
    <label for="zoom">Zoom <output id="zoomv">21 m</output><input id="zoom" type="range" min="12" max="70" step="1" value="21"></label>
  </div>
  <div class="chip views" role="group" aria-label="Camera view">
    <button id="v-drive" aria-pressed="true">Drive</button><button id="v-town" aria-pressed="false">Arch</button><button id="v-over" aria-pressed="false">Overview</button><button id="v-top" aria-pressed="false">Top</button>
  </div>
</div>
<div id="loading">Loading block<div class="bar"><i id="bar"></i></div><small id="loadtxt">3 MB of models and textures</small></div>
<div id="err" hidden><div><b style="font:600 22px var(--display);letter-spacing:.08em;text-transform:uppercase">This view needs WebGL</b><p style="color:var(--dim)">Your browser blocked it. Try Chrome or Safari with hardware acceleration on.</p></div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const R = 4.6, ARCH_Y = 24;                          // street half-width and arch position, from the Blender scripts (metres)
const b2t = (x, y, z = 0) => new THREE.Vector3(x, z, -y);   // Blender (x east, y north, z up) -> three (x, y up, -z north)

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $('view'), antialias: true, powerPreference: 'high-performance' }); }
catch (e) { $('err').hidden = false; $('loading').hidden = true; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141c3a); scene.fog = new THREE.Fog(0x141c3a, 55, 120);
scene.add(new THREE.HemisphereLight(0x5a6fb8, 0x3a3a50, 1.45));
const sun = new THREE.DirectionalLight(0xff9a55, 3.1); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 140 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05; scene.add(sun, sun.target);
const SUNDIR = new THREE.Vector3(0.55, -0.42, 0.45).normalize();   // light travel direction (Blender (0.55,-0.45,-0.42) mapped to three)
for (const [sx, sy] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {      // four corner lamps
  const l = new THREE.PointLight(0xffc27a, 60, 16, 2); l.position.copy(b2t(sx * 3.8, sy * (R + .7), 4.3)); scene.add(l);
}

const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 300);
const rig = { tx: 1.3, tz: 6, pitch: 65, dist: 21, mode: 'drive' };
const HFOV = 54.4 * Math.PI / 180;                    // phone game camera: width-fitted, like the Blender renders
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 1 ? 2 * Math.atan(Math.tan(HFOV / 2) / camera.aspect) * 180 / Math.PI : 42; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- load ---------- */
const loader = new GLTFLoader();
// The page host serves no .glb, so each model is a base64 text file: fetch, decode, parse.
async function load(url, what) {
  const txt = await (await fetch(url)).text(); const bin = atob(txt.trim()); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  if (what === 'scene') $('bar').style.width = '60%';
  return new Promise((ok, fail) => loader.parse(u8.buffer, '', g => { if (what === 'scene') $('bar').style.width = '100%'; ok(g); }, fail));
}
let city, charGltf;
try { [city, charGltf] = await Promise.all([load('test_scene.glb.b64.txt', 'scene'), load('character.glb.b64.txt', 'char')]); }
catch (e) { $('loadtxt').textContent = 'Could not load the models: ' + (e.message || e); throw e; }
scene.add(city.scene);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshLambertMaterial({ color: 0x20222e })); ground.rotation.x = -Math.PI / 2; ground.position.y = -.3; ground.receiveShadow = true; scene.add(ground);   // dark ground past the street slab
city.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; if (o.material && o.material.emissive && o.material.emissiveIntensity > 0) o.material.emissiveIntensity = o.material.emissiveIntensity * .9; } });
const find = n => city.scene.getObjectByName(n);
const player = find('player'), taxi = find('taxi');

/* ---------- people ---------- */
const JACKETS = ['#3f6b3a', '#7a2f2a', '#2f4f8a', '#b08a2a', '#5a5a62', '#8a4a7a', '#2b2b30', '#a8a090'];
const PANTS = ['#26303f', '#3a3228', '#1c1c22', '#4a4f5a'], SKINS = ['#d9a577', '#b87c52', '#f0c8a0', '#8a5a3a', '#e8b890'], HAIR = ['#1c1612', '#3a2a1c', '#0e0e10', '#6a4a2a'];
let seed = 11; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; const pick = a => a[Math.floor(rnd() * a.length)];
const mixers = [], people = [];
function makePerson(opts = {}) {
  const root = charGltf.scene.clone(true); root.scale.setScalar(.92);
  const cols = { char_jacket: opts.jacket || pick(JACKETS), char_pants: pick(PANTS), char_skin: pick(SKINS), char_hair: pick(HAIR) };
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); if (cols[o.material.name]) o.material.color.set(cols[o.material.name]); } });
  const mixer = new THREE.AnimationMixer(root); const act = {};
  for (const c of charGltf.animations) { act[c.name] = mixer.clipAction(c); }
  scene.add(root); mixers.push(mixer); return { root, mixer, act };
}
const walkers = [];
for (let i = 0; i < 12; i++) {
  const p = makePerson(); const alongY = i % 2 === 0, dir = i % 4 < 2 ? 1 : -1, side = (i % 3 === 0) ? -1 : 1;
  const lane = side * (i % 2 ? 7.3 : 5.6) * (alongY ? 1 : 1);
  const w = { ...p, alongY, dir, lane, pos: (rnd() - .5) * 70, speed: 1.15 + rnd() * .5 };
  w.act.walk.timeScale = w.speed / 1.4; w.act.walk.play(); w.act.walk.time = rnd(); walkers.push(w);
}
const hero = makePerson({ jacket: '#2f6b3a' }), victim = makePerson({ jacket: '#7a2f2a' });   // a fight to show the punch clip
const fightAt = b2t(6.55, 7.3);   // open sidewalk at the NE corner, in view of the drive camera
hero.root.position.copy(fightAt).add(new THREE.Vector3(.5, 0, 0)); hero.root.rotation.y = Math.atan2(1, 0) ; // faces -x
victim.root.position.copy(fightAt).add(new THREE.Vector3(-.55, 0, 0)); victim.root.rotation.y = Math.atan2(-1, 0);
hero.act.idle.play(); victim.act.idle.play();
for (const c of [hero, victim]) c.act.punch.setLoop(THREE.LoopOnce, 1);
let punchT = 0, hit = 0;

/* ---------- camera views ---------- */
const VIEWS = { drive: { mode: 'drive', pitch: 65, dist: 21 }, town: { mode: 'free', tx: 0, tz: -(ARCH_Y - 8), pitch: 60, dist: 24 }, over: { mode: 'free', tx: 0, tz: -4, pitch: 42, dist: 55 }, top: { mode: 'free', tx: 0, tz: 0, pitch: 85, dist: 34 } };
function setView(k) {
  Object.assign(rig, VIEWS[k]); for (const [id, v] of [['drive', 'v-drive'], ['town', 'v-town'], ['over', 'v-over'], ['top', 'v-top']]) $(v).setAttribute('aria-pressed', String(id === k));
  syncSliders();
}
const syncSliders = () => { $('tilt').value = rig.pitch; $('zoom').value = rig.dist; $('tiltv').textContent = Math.round(rig.pitch) + '°'; $('zoomv').textContent = Math.round(rig.dist) + ' m'; };
for (const [id, k] of [['v-drive', 'drive'], ['v-town', 'town'], ['v-over', 'over'], ['v-top', 'top']]) $(id).addEventListener('click', () => setView(k));
$('tilt').addEventListener('input', e => { rig.pitch = +e.target.value; syncSliders(); });
$('zoom').addEventListener('input', e => { rig.dist = +e.target.value; syncSliders(); });
// drag to pan, pinch / wheel to zoom
const ptr = new Map(); let pinch0 = 0, dist0 = 0;
const cv = $('view');
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = rig.dist; } });
cv.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return; const [px, py] = ptr.get(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; rig.dist = Math.min(70, Math.max(12, dist0 * pinch0 / Math.max(20, Math.hypot(a[0] - b[0], a[1] - b[1])))); syncSliders(); return; }
  if (rig.mode === 'drive') { rig.mode = 'free'; ['v-drive', 'v-town', 'v-over', 'v-top'].forEach(id => $(id).setAttribute('aria-pressed', 'false')); }
  const k = 2 * rig.dist * Math.tan(HFOV / 2) / innerWidth, p = rig.pitch * Math.PI / 180;
  rig.tx -= (e.clientX - px) * k; rig.tz -= (e.clientY - py) * k / Math.max(.3, Math.sin(p));
});
for (const t of ['pointerup', 'pointercancel']) cv.addEventListener(t, e => ptr.delete(e.pointerId));
cv.addEventListener('wheel', e => { e.preventDefault(); rig.dist = Math.min(70, Math.max(12, rig.dist * (1 + Math.sign(e.deltaY) * .08))); syncSliders(); }, { passive: false });

/* ---------- loop ---------- */
$('loading').hidden = true;
const clock = new THREE.Clock(); let fpsN = 0, fpsT = 0, run = 0;
const SPAN = 42;
function frame() {
  const dt = Math.min(clock.getDelta(), .05); run += dt;
  // traffic: the red sedan drives north up its lane, the taxi east along its lane; both wrap around
  if (player) { player.position.z -= 9 * dt; if (player.position.z < -40) player.position.z = 32; }
  if (taxi) { taxi.position.x += 8 * dt; if (taxi.position.x > 40) taxi.position.x = -40; }
  for (const w of walkers) {
    w.pos += w.dir * w.speed * dt; if (w.pos > SPAN) w.pos = -SPAN; if (w.pos < -SPAN) w.pos = SPAN;
    if (w.alongY) { w.root.position.set(w.lane, 0, -w.pos); w.root.rotation.y = w.dir > 0 ? 0 : Math.PI; }     // north = -z
    else { w.root.position.set(w.pos, 0, -w.lane); w.root.rotation.y = w.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
  }
  punchT += dt;                                                    // fight loop: jab every 2.2 s, victim staggers back
  if (punchT > 2.2) { punchT = 0; hero.act.punch.reset().play(); hit = 1; }
  hit = Math.max(0, hit - dt * 2); victim.root.position.x = fightAt.x - .55 - .25 * Math.sin(Math.min(1, (1 - hit) * 2) * Math.PI) * (hit > 0 ? 1 : 0);
  for (const m of mixers) m.update(dt);
  // camera
  if (rig.mode === 'drive' && player) { rig.tx += (player.position.x - rig.tx) * Math.min(1, dt * 4); rig.tz += (player.position.z - 3 - rig.tz) * Math.min(1, dt * 4); }
  rig.tx = Math.max(-30, Math.min(30, rig.tx)); rig.tz = Math.max(-52, Math.min(40, rig.tz));
  const p = rig.pitch * Math.PI / 180;
  camera.position.set(rig.tx, Math.sin(p) * rig.dist, rig.tz + Math.cos(p) * rig.dist); camera.lookAt(rig.tx, 0, rig.tz);
  sun.target.position.set(rig.tx, 0, rig.tz); sun.position.set(rig.tx - SUNDIR.x * 60, -SUNDIR.y * 60, rig.tz - SUNDIR.z * 60);
  renderer.render(scene, camera);
  fpsN++; fpsT += dt; if (fpsT > .5) { $('fps').textContent = Math.round(fpsN / fpsT) + ' fps'; fpsN = 0; fpsT = 0; }
  requestAnimationFrame(frame);
}
syncSliders(); frame();
window.__city = { rig, renderer, scene, camera, setView, hero, victim };
</script>
