<title>Chinatown Block</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed WebGL canvas; HUD pinned to the edges (title chip top-left, fps top-right, view/camera controls bottom). */
:root {
  --night: #0c1222;        /* page + panel base, deep blue-black */
  --panel: rgba(12, 18, 34, .78);
  --line: rgba(255, 236, 200, .16);
  --paper: #f3ead6;        /* warm text, like lit signage paper */
  --dim: #a9a79f;
  --lamp: #ffb347;         /* sodium-lamp amber, the one accent */
  --lantern: #e0361f;
  --display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--paper); font: 500 14px/1.35 var(--body); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: fixed; left: 0; right: 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.top { top: 0; padding-top: calc(12px + env(safe-area-inset-top, 0px)); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.bottom { bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; }
.chip { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: auto; }
.title { padding: 7px 11px 6px; }
.title b { display: block; font: 600 19px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.title span { color: var(--dim); font-size: 12px; }
#doorbtn { all: unset; box-sizing: border-box; padding: 5px 10px; font: 600 14px var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--paper); cursor: pointer; }
#doorbtn[aria-pressed="true"] { color: var(--night); background: var(--lamp); border-radius: 6px; }
#doorbtn:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
.tr { display: flex; gap: 8px; align-items: center; }
#fps { padding: 5px 9px; font: 500 13px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-variant-numeric: tabular-nums; }
.views { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0; overflow: hidden; }
.views button { all: unset; box-sizing: border-box; text-align: center; padding: 11px 2px 10px; font: 600 15px/1 var(--display); letter-spacing: .07em; text-transform: uppercase; color: var(--dim); cursor: pointer; border-left: 1px solid var(--line); }
.views button:first-child { border-left: 0; }
.views button[aria-pressed="true"] { color: var(--night); background: var(--lamp); }
.views button:focus-visible { outline: 2px solid var(--paper); outline-offset: -3px; }
.cam { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 8px 12px 9px; }
.cam label { display: grid; gap: 3px; font: 600 12px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.cam label output { float: right; color: var(--paper); font-variant-numeric: tabular-nums; }
.cam input { width: 100%; margin: 0; accent-color: var(--lamp); touch-action: pan-x; }
#loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: var(--night); font: 600 22px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; z-index: 5; }
#loading small { font: 500 13px var(--body); letter-spacing: 0; text-transform: none; color: var(--dim); }
#loading .bar { width: 200px; height: 3px; background: var(--line); margin: 0 auto; }
#loading .bar i { display: block; height: 100%; width: 0; background: var(--lamp); }
#err { position: fixed; inset: 0; z-index: 6; display: grid; place-content: center; padding: 24px; text-align: center; background: var(--night); }
</style>
<canvas id="view"></canvas>
<div class="hud top"><div class="chip title"><b>Chinatown Block</b><span>Test scene &middot; built in Blender</span></div><div class="tr"><button class="chip" id="doorbtn" aria-pressed="false">Doors</button><div class="chip" id="fps">&ndash; fps</div></div></div>
<div class="hud bottom">
  <div class="chip cam">
    <label for="tilt">Tilt <output id="tiltv">45&deg;</output><input id="tilt" type="range" min="35" max="85" step="1" value="45"></label>
    <label for="zoom">Zoom <output id="zoomv">44 m</output><input id="zoom" type="range" min="12" max="70" step="1" value="44"></label>

    <button id="v-drive" aria-pressed="true">Drive</button><button id="v-enter" aria-pressed="false">Enter</button><button id="v-town" aria-pressed="false">Arch</button><button id="v-over" aria-pressed="false">Overview</button><button id="v-top" aria-pressed="false">Top</button>
  </div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const $ = id => document.getElementById(id);
const R = 4.6, ARCH_Y = 24;                          // street half-width and arch position, from the Blender scripts (metres)
const b2t = (x, y, z = 0) => new THREE.Vector3(x, z, -y);   // Blender (x east, y north, z up) -> three (x, y up, -z north)
const rad = d => d * Math.PI / 180;

let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: $('view'), antialias: true, powerPreference: 'high-performance' }); }
catch (e) { $('err').hidden = false; $('loading').hidden = true; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.AgXToneMapping; renderer.toneMappingExposure = 1.15;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x141c3a); scene.fog = new THREE.Fog(0x141c3a, 55, 120);
scene.add(new THREE.HemisphereLight(0x5a6fb8, 0x3a3a50, 1.45));
const sun = new THREE.DirectionalLight(0xff9a55, 3.1); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 140 });
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.05; scene.add(sun, sun.target);
const SUNDIR = new THREE.Vector3(0.55, -0.42, 0.45).normalize();   // light travel direction (Blender (0.55,-0.45,-0.42) mapped to three)
for (const [sx, sy] of [[-1, -1], [-1, 1], [1, -1], [1, 1]]) {      // four corner lamps
  const l = new THREE.PointLight(0xffc27a, 60, 16, 2); l.position.copy(b2t(sx * 3.8, sy * (R + .7), 4.3)); scene.add(l);
}

const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 300);
const rig = { tx: 1.3, tz: 6, pitch: 45, dist: 44, mode: 'drive' };      // user's chosen game camera: 45 deg tilt, 44 m
const HFOV = 54.4 * Math.PI / 180;                    // phone game camera: width-fitted, like the Blender renders
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  camera.fov = w / h < 1 ? 2 * Math.atan(Math.tan(HFOV / 2) / camera.aspect) * 180 / Math.PI : 42; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* ---------- load ---------- */
const loader = new GLTFLoader();
// The page host serves no .glb, so each model is a base64 text file: fetch, decode, parse.
async function loadGlb(url, bar) {
  const txt = await (await fetch(url)).text(); const bin = atob(txt.trim()); const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Promise((ok, fail) => loader.parse(u8.buffer, '', g => { if (bar) $('bar').style.width = bar; ok(g); }, fail));
}
let city, charGltf, sedanG, taxiG, carList;
try {
  [city, charGltf, sedanG, taxiG, carList] = await Promise.all([loadGlb('test_scene.glb.b64.txt', '70%'), loadGlb('character.glb.b64.txt'), loadGlb('car_sedan.glb.b64.txt'), loadGlb('car_taxi.glb.b64.txt'), fetch('cars.json').then(r => r.json())]);
  $('bar').style.width = '100%';
} catch (e) { $('loadtxt').textContent = 'Could not load the models: ' + (e.message || e); throw e; }
scene.add(city.scene);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), new THREE.MeshLambertMaterial({ color: 0x20222e })); ground.rotation.x = -Math.PI / 2; ground.position.y = -.3; ground.receiveShadow = true; scene.add(ground);   // dark ground past the street slab
city.scene.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });

/* ---------- async helpers: every script step awaits frames, so it pauses and resumes with the render loop ---------- */
let frameWaiters = [];
const nextFrame = () => new Promise(r => frameWaiters.push(r));
const wait = async s => { let t = 0; while (t < s) t += await nextFrame(); };
const tween = async (dur, fn) => { let t = 0; while (t < dur) { t += await nextFrame(); fn(Math.min(1, t / dur)); } fn(1); };
const smooth = u => u * u * (3 - 2 * u);

/* ---------- cars: body + 4 hinged doors, built from car_*.glb ---------- */
const allCars = {};
function makeCar(kind, color) {
  const src = (kind === 'taxi' ? taxiG : sedanG).scene.clone(true); const mats = new Map();
  src.traverse(o => {
    if (!o.isMesh) return; o.castShadow = o.receiveShadow = true;
    o.material = (a => Array.isArray(a) ? a.map(m => cm(m)) : cm(a))(o.material);
  });
  function cm(m) { if (!mats.has(m)) { const c = m.clone(); if (m.name.startsWith('paint_')) c.color.set(color); mats.set(m, c); } return mats.get(m); }
  const group = new THREE.Group(); group.add(src);
  const car = { group, doors: {}, seat: {}, stand: {}, occupants: {} };
  src.traverse(o => {
    let m = /door_(FL|FR|RL|RR)$/.exec(o.name); if (m) car.doors[m[1]] = { node: o, side: o.userData.side, max: rad(o.userData.max_open_deg || 62), cur: 0, target: 0 };
    m = /seat_(FL|FR|RL|RR)$/.exec(o.name); if (m) car.seat[m[1]] = o;
    m = /stand_(FL|FR|RL|RR)$/.exec(o.name); if (m) car.stand[m[1]] = o;
  });
  car.setDoor = (tag, open) => { if (car.doors[tag]) car.doors[tag].target = open ? 1 : 0; };
  car.setAll = open => { for (const t in car.doors) car.setDoor(t, open); };
  scene.add(group); return car;
}
const updateDoors = (car, dt) => { const k = 1 - Math.exp(-dt * 9); for (const d of Object.values(car.doors)) { d.cur += (d.target - d.cur) * k; d.node.rotation.y = d.side * d.max * d.cur; } };
for (const c of carList) {
  const car = makeCar(c.kind, c.color); car.group.position.copy(b2t(c.x, c.y, 0)); car.group.rotation.y = rad(c.rz); allCars[c.name] = car;
}
const player = allCars.player.group, taxi = allCars.taxi.group;

/* ---------- people ---------- */
const JACKETS = ['#3f6b3a', '#7a2f2a', '#2f4f8a', '#b08a2a', '#5a5a62', '#8a4a7a', '#2b2b30', '#a8a090'];
const PANTS = ['#26303f', '#3a3228', '#1c1c22', '#4a4f5a'], SKINS = ['#d9a577', '#b87c52', '#f0c8a0', '#8a5a3a', '#e8b890'], HAIR = ['#1c1612', '#3a2a1c', '#0e0e10', '#6a4a2a'];
let seed = 11; const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; const pick = a => a[Math.floor(rnd() * a.length)];
const mixers = [];
function makePerson(opts = {}) {
  const root = charGltf.scene.clone(true); root.scale.setScalar(.92);
  const cols = { char_jacket: opts.jacket || pick(JACKETS), char_pants: pick(PANTS), char_skin: pick(SKINS), char_hair: pick(HAIR) };
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); if (cols[o.material.name]) o.material.color.set(cols[o.material.name]); } });
  const mixer = new THREE.AnimationMixer(root); const act = {};
  for (const c of charGltf.animations) act[c.name] = mixer.clipAction(c);
  scene.add(root); mixers.push(mixer); return { root, mixer, act, cur: null };
}
function play(a, name, { once = false, fade = .15, timeScale = 1 } = {}) {      // crossfade to a clip; once = play through and hold the last pose
  const next = a.act[name]; if (a.cur === next && !once) return next;
  if (a.cur && a.cur !== next) a.cur.fadeOut(fade);
  next.reset(); next.setLoop(once ? THREE.LoopOnce : THREE.LoopRepeat, Infinity); next.clampWhenFinished = once; next.timeScale = timeScale; next.fadeIn(fade).play(); a.cur = next; return next;
}
const faceDir = (a, dx, dz) => { a.root.rotation.y = Math.atan2(-dx, -dz); };
async function walkTo(a, target, speed = 1.5) {
  play(a, 'walk', { timeScale: speed / 1.4 }); const p = a.root.position;
  for (;;) {
    const dt = await nextFrame(); const d = new THREE.Vector3().subVectors(target, p); d.y = 0; const dist = d.length(); if (dist < .04) break;
    d.normalize(); p.addScaledVector(d, Math.min(dist, speed * dt)); faceDir(a, d.x, d.z);
  }
}
/* Where an actor stands to use a door: the stand marker's world position, facing the seat marker. Works for any car pose and any door. */
function standInfo(car, tag) {
  car.group.updateWorldMatrix(true, true);
  const pos = car.stand[tag].getWorldPosition(new THREE.Vector3()), seat = car.seat[tag].getWorldPosition(new THREE.Vector3());
  const d = seat.sub(pos); d.y = 0; d.normalize(); return { pos, dir: d };
}
async function enterCar(a, car, tag) {
  const { pos, dir } = standInfo(car, tag); await walkTo(a, pos); faceDir(a, dir.x, dir.z); play(a, 'idle', { fade: .1 });
  const act = play(a, 'enter_' + tag[1], { once: true, fade: .1 }), T = act.getClip().duration;
  await wait(T * .10); car.setDoor(tag, true);            // door starts opening as the hand reaches the handle
  await wait(T * .75); car.setDoor(tag, false);           // closes once he is seated
  await wait(T * .15 + .2); a.root.visible = false; car.occupants[tag] = a;
}
async function exitCar(a, car, tag) {
  const { pos, dir } = standInfo(car, tag); a.root.position.copy(pos); faceDir(a, dir.x, dir.z); a.root.visible = true; delete car.occupants[tag];
  car.setDoor(tag, true); await wait(.35);
  const act = play(a, 'exit_' + tag[1], { once: true, fade: .05 }), T = act.getClip().duration;
  await wait(T * .85); car.setDoor(tag, false); await wait(T * .15);
  play(a, 'idle', { fade: .15 });
}

/* ---------- life: walkers, a fight, traffic ---------- */
const walkers = [];
for (let i = 0; i < 12; i++) {
  const p = makePerson(); const alongY = i % 2 === 0, dir = i % 4 < 2 ? 1 : -1, side = (i % 3 === 0) ? -1 : 1;
  const lane = side * (i % 2 ? 7.3 : 5.6);
  const w = { ...p, alongY, dir, lane, pos: (rnd() - .5) * 70, speed: 1.15 + rnd() * .5 };
  w.act.walk.timeScale = w.speed / 1.4; w.act.walk.play(); w.act.walk.time = rnd(); walkers.push(w);
}
const hero = makePerson({ jacket: '#2f6b3a' }), victim = makePerson({ jacket: '#7a2f2a' });   // a fight to show the punch clip
const fightAt = b2t(6.55, 7.3);
hero.root.position.copy(fightAt).add(new THREE.Vector3(.5, 0, 0)); hero.root.rotation.y = Math.PI / 2;
victim.root.position.copy(fightAt).add(new THREE.Vector3(-.55, 0, 0)); victim.root.rotation.y = -Math.PI / 2;
hero.act.idle.play(); victim.act.idle.play(); hero.act.punch.setLoop(THREE.LoopOnce, 1);
let punchT = 0, hit = 0;

/* ---------- door demo: the hero takes a sedan's driver door, a pedestrian the taxi's passenger door ---------- */
const demo = { sedan: makeCar('sedan', '#c8201c'), taxi: makeCar('taxi', '#f2b61c'), hero: makePerson({ jacket: '#2f6b3a' }), npc: makePerson({ jacket: '#8a4a7a' }) };
demo.sedan.group.position.copy(b2t(-3.6, -26)); demo.sedan.group.rotation.y = Math.PI;       // west parking lane, nose south
demo.taxi.group.position.copy(b2t(-3.6, -34)); demo.taxi.group.rotation.y = Math.PI;
const heroHome = b2t(-0.9, -30), npcHome = b2t(-6.4, -37);
async function demoLoop() {
  for (;;) {
    for (const [a, home] of [[demo.hero, heroHome], [demo.npc, npcHome]]) { a.root.position.copy(home); a.root.visible = true; play(a, 'idle', { fade: .01 }); }
    await wait(1.0);
    await Promise.all([enterCar(demo.hero, demo.sedan, 'FL'), (async () => { await wait(.8); await enterCar(demo.npc, demo.taxi, 'FR'); })()]);
    await wait(1.6);                                                          // both sit in their cars
    await Promise.all([exitCar(demo.hero, demo.sedan, 'FL'), (async () => { await wait(.5); await exitCar(demo.npc, demo.taxi, 'FR'); })()]);
    await Promise.all([walkTo(demo.hero, heroHome.clone().add(new THREE.Vector3(.4, 0, 5))), walkTo(demo.npc, npcHome.clone().add(new THREE.Vector3(0, 0, 4)))]);
    play(demo.hero, 'idle'); play(demo.npc, 'idle'); await wait(1.4);
  }
}
demoLoop();

/* ---------- camera views ---------- */
const VIEWS = { drive: { mode: 'drive', pitch: 45, dist: 44 }, enter: { mode: 'free', tx: -3.2, tz: 31.5, pitch: 50, dist: 15 }, town: { mode: 'free', tx: 0, tz: -(ARCH_Y - 8), pitch: 60, dist: 24 }, over: { mode: 'free', tx: 0, tz: -4, pitch: 42, dist: 55 }, top: { mode: 'free', tx: 0, tz: 0, pitch: 85, dist: 34 } };
const IDS = { drive: 'v-drive', enter: 'v-enter', town: 'v-town', over: 'v-over', top: 'v-top' };
function setView(k) { Object.assign(rig, VIEWS[k]); for (const [id, v] of Object.entries(IDS)) $(v).setAttribute('aria-pressed', String(id === k)); syncSliders(); }
const syncSliders = () => { $('tilt').value = rig.pitch; $('zoom').value = rig.dist; $('tiltv').textContent = Math.round(rig.pitch) + '°'; $('zoomv').textContent = Math.round(rig.dist) + ' m'; };
for (const [k, id] of Object.entries(IDS)) $(id).addEventListener('click', () => setView(k));
$('tilt').addEventListener('input', e => { rig.pitch = +e.target.value; syncSliders(); });
$('zoom').addEventListener('input', e => { rig.dist = +e.target.value; syncSliders(); });
let doorsOpen = false;
$('doorbtn').addEventListener('click', () => { doorsOpen = !doorsOpen; $('doorbtn').setAttribute('aria-pressed', String(doorsOpen)); for (const [n, c] of Object.entries(allCars)) if (n.startsWith('parked')) c.setAll(doorsOpen); });
// drag to pan, pinch / wheel to zoom
const ptr = new Map(); let pinch0 = 0, dist0 = 0;
const cv = $('view');
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]); if (ptr.size === 2) { const [a, b] = [...ptr.values()]; pinch0 = Math.hypot(a[0] - b[0], a[1] - b[1]); dist0 = rig.dist; } });
cv.addEventListener('pointermove', e => {
  if (!ptr.has(e.pointerId)) return; const [px, py] = ptr.get(e.pointerId); ptr.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptr.size === 2) { const [a, b] = [...ptr.values()]; rig.dist = Math.min(70, Math.max(10, dist0 * pinch0 / Math.max(20, Math.hypot(a[0] - b[0], a[1] - b[1])))); syncSliders(); return; }
  if (rig.mode === 'drive') { rig.mode = 'free'; Object.values(IDS).forEach(id => $(id).setAttribute('aria-pressed', 'false')); }
  const k = 2 * rig.dist * Math.tan(HFOV / 2) / innerWidth, p = rig.pitch * Math.PI / 180;
  rig.tx -= (e.clientX - px) * k; rig.tz -= (e.clientY - py) * k / Math.max(.3, Math.sin(p));
});
for (const t of ['pointerup', 'pointercancel']) cv.addEventListener(t, e => ptr.delete(e.pointerId));
cv.addEventListener('wheel', e => { e.preventDefault(); rig.dist = Math.min(70, Math.max(10, rig.dist * (1 + Math.sign(e.deltaY) * .08))); syncSliders(); }, { passive: false });
$('zoom').min = 10;

/* ---------- loop ---------- */
$('loading').hidden = true;
const clock = new THREE.Clock(); let fpsN = 0, fpsT = 0, manual = false;
const SPAN = 42;
function update(dt) {
  const ws = frameWaiters; frameWaiters = []; for (const r of ws) r(dt);       // resume scripted sequences (demo, enter/exit)
  player.position.z -= 9 * dt; if (player.position.z < -40) player.position.z = 32;           // traffic: red sedan north, taxi east
  taxi.position.x += 8 * dt; if (taxi.position.x > 40) taxi.position.x = -40;
  for (const w of walkers) {
    w.pos += w.dir * w.speed * dt; if (w.pos > SPAN) w.pos = -SPAN; if (w.pos < -SPAN) w.pos = SPAN;
    if (w.alongY) { w.root.position.set(w.lane, 0, -w.pos); w.root.rotation.y = w.dir > 0 ? 0 : Math.PI; }     // north = -z
    else { w.root.position.set(w.pos, 0, -w.lane); w.root.rotation.y = w.dir > 0 ? -Math.PI / 2 : Math.PI / 2; }
  }
  punchT += dt;                                                    // fight loop: jab every 2.2 s, victim staggers back
  if (punchT > 2.2) { punchT = 0; hero.act.punch.reset().play(); hit = 1; }
  hit = Math.max(0, hit - dt * 2); victim.root.position.x = fightAt.x - .55 - .25 * Math.sin(Math.min(1, (1 - hit) * 2) * Math.PI) * (hit > 0 ? 1 : 0);
  for (const m of mixers) m.update(dt);
  for (const c of [...Object.values(allCars), demo.sedan, demo.taxi]) updateDoors(c, dt);
  if (rig.mode === 'drive') { rig.tx += (player.position.x - rig.tx) * Math.min(1, dt * 4); rig.tz += (player.position.z - 3 - rig.tz) * Math.min(1, dt * 4); }
